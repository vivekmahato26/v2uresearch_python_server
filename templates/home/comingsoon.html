{% load static %}
{% block content %}
{% if not obj_error and not region.is_active %}
    <!-- Mask & flexbox options-->
    <div class="mask rgba-black-light d-flex justify-content-center align-items-center">
        <!-- Content -->
        <div class="text-center white-text mx-5 wow fadeIn font-weight-light">
            <div class="mx-auto mt-5">
		    <img src="{% static 'images/{{region.country_code|upper|slice:2}}.png' %}" alt="US" height="256" width="256">
            </div>
            <h1 class="display-3">Welcome to <span class="text-primary"><strong>{{ region }}</strong></span> </h1>
          <h1 class="display-4 mb-4">
            <strong>Coming Soon!</strong>
          </h1>
          <!-- Time Counter -->
          <p id="time-counter" class=" display-5 text-danger border-light my-4"></p>
          <h4 class="mb-4 d-none">
            <strong>We're working hard to finish the development of this site. </strong>
          </h4>
          <h4 class="mb-4 d-none">
            <strong>Until then have a look at our Free Bootstrap 4 tutorials</strong>
          </h4>
          <p>&nbsp;</p>
        </div>
        <!-- Content -->
      </div>
      <!-- Mask & flexbox options-->
       <!-- Time Counter -->
  <script type="text/javascript">
    // Set the date we're counting down to
    var countDownDate = new Date();
    countDownDate.setDate(countDownDate.getDate() + 30);

    // Update the count down every 1 second
    var x = setInterval(function () {

      // Get todays date and time
      var now = new Date().getTime();

      // Find the distance between now an the count down date
      var distance = countDownDate - now;

      // Time calculations for days, hours, minutes and seconds
      var days = Math.floor(distance / (1000 * 60 * 60 * 24));
      var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((distance % (1000 * 60)) / 1000);

      // Display the result in the element with id="demo"
      document.getElementById("time-counter").innerHTML = days + "d " + hours + "h " +
        minutes + "m " + seconds + "s ";

      // If the count down is finished, write some text
      if (distance < 0) {
        clearInterval(x);
        document.getElementById("time-counter").innerHTML = "EXPIRED";
      }
    }, 1000);

  </script>
{% endif %}
{% endblock %}
