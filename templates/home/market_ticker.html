<div class="market-ticker-wrapper">
    <div class="container-fluid">
        <!-- Market Toggle -->
        <div class="d-flex justify-content-between align-items-center mb-3 px-3">
             <h4 class="mb-0 fw-bold">Market Movers</h4>
             <div class="market-toggle">
                <button class="btn btn-sm btn-toggle {% if region.country_code == 'AUS' %}active{% endif %}" onclick="switchMarket('australia', this)">Australia 🇦🇺</button>
                <button class="btn btn-sm btn-toggle {% if region.country_code == 'USA' %}active{% endif %}" onclick="switchMarket('america', this)">USA 🇺🇸</button>
                <button class="btn btn-sm btn-toggle {% if region.country_code == 'CAN' %}active{% endif %}" onclick="switchMarket('canada', this)">Canada 🇨🇦</button>
             </div>
        </div>

        <div class="row flex-nowrap overflow-auto market-ticker-scroll pb-2" id="ticker-container">
            <!-- Top Gainers -->
            <div class="col-md-4 col-sm-10 col-10 ticker-col">
                <div class="ticker-box">
                    <h6 class="ticker-title text-success"><i class="fas fa-arrow-up"></i> Top Gainers</h6>
                    <div id="widget-gainers" class="tv-widget-container"></div>
                </div>
            </div>

            <!-- Top Losers -->
            <div class="col-md-4 col-sm-10 col-10 ticker-col">
                <div class="ticker-box">
                    <h6 class="ticker-title text-danger"><i class="fas fa-arrow-down"></i> Top Losers</h6>
                    <div id="widget-losers" class="tv-widget-container"></div>
                </div>
            </div>

            <!-- Most Active -->
             <div class="col-md-4 col-sm-10 col-10 ticker-col">
                <div class="ticker-box">
                    <h6 class="ticker-title text-primary"><i class="fas fa-fire"></i> Most Active</h6>
                    <div id="widget-active" class="tv-widget-container"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    function createWidget(containerId, screen, market) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; // Clear previous widget
        
        const theme = document.documentElement.getAttribute('data-theme') || 'light';
        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-screener.js';
        script.async = true;
        script.innerHTML = JSON.stringify({
            "width": "100%",
            "height": 300,
            "defaultColumn": "overview",
            "defaultScreen": screen,
            "market": market,
            "showToolbar": false,
            "colorTheme": theme,
            "locale": "en",
            "isTransparent": true
        });
        container.appendChild(script);
    }

    function switchMarket(market, btn) {
        // Update Buttons
        document.querySelectorAll('.btn-toggle').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Reload Widgets
        createWidget('widget-gainers', 'top_gainers', market);
        createWidget('widget-losers', 'top_losers', market);
        createWidget('widget-active', 'most_active', market);
    }

    // Initialize based on current region
    document.addEventListener('DOMContentLoaded', function() {
        const regionMapping = {
            'AUS': 'australia',
            'USA': 'america',
            'CAN': 'canada'
        };
        const currentRegion = "{{ region.country_code }}";
        const defaultMarket = regionMapping[currentRegion] || 'australia';
        const defaultBtn = document.querySelector('.btn-toggle.active') || document.querySelector('.btn-toggle');
        
        switchMarket(defaultMarket, defaultBtn);

        // Listen for theme changes to reload widgets
        const observer = shadow_observer || new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
                    const activeBtn = document.querySelector('.btn-toggle.active');
                    if (activeBtn) {
                        const market = activeBtn.getAttribute('onclick').match(/'([^']+)'/)[1];
                        switchMarket(market, activeBtn);
                    }
                }
            });
        });
        
        if (!window.shadow_observer) {
            observer.observe(document.documentElement, { attributes: true });
            window.shadow_observer = observer;
        }
    });

    // Handle initial load and mutation observer fallback
    var shadow_observer = window.shadow_observer;
</script>
